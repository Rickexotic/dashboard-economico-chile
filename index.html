<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Dashboard Económico Chile</title>
  <meta name="description" content="Dashboard ejecutivo con indicadores económicos de Chile en tiempo real: Dólar, Cobre, UF, EMBI, IPC, TPM y más. Con asistente virtual Siwa.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0f172a; --bg2:#1e293b; --bg3:#16213e;
      --blue:#3b82f6; --green:#22c55e; --orange:#f97316;
      --red:#ef4444; --purple:#a78bfa; --white:#fff; --muted:#94a3b8;
    }
    body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--white); min-height:100vh; }

    .top-bar {
      background:rgba(15,23,42,.96);
      border-bottom:1px solid rgba(59,130,246,.25);
      padding:0 20px;
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      position:sticky;
      top:0;
      z-index:100;
    }
    .top-bar-left { display:flex; align-items:center; gap:8px; }
    .top-bar-bar { width:3px; height:18px; background:var(--blue); border-radius:999px; }
    .top-bar-title { font-size:1rem; font-weight:700; color:var(--white); }
    .top-bar-title span { color:var(--blue); }
    .top-bar-date { font-size:.72rem; color:var(--muted); white-space:nowrap; }

    .main { padding:16px 24px 100px; }
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-bottom:14px; }

    .kpi-card {
      background:var(--bg2);
      border:1px solid rgba(255,255,255,.07);
      border-radius:10px;
      padding:10px 10px;
      border-left:none;
      transition:transform .2s,border-color .2s,box-shadow .2s;
      text-align:left;
    }
    .kpi-card:hover { transform:translateY(-2px); }
    .kpi-card-btn { cursor:pointer; font:inherit; }
    .kpi-card.active {
      background:rgba(59,130,246,.10);
      border-color:rgba(59,130,246,.40);
      box-shadow:0 0 0 1px rgba(59,130,246,.14);
    }

    .kpi-label {
      font-size:.52rem;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.03em;
      font-weight:600;
      margin-bottom:3px;
      line-height:1.2;
    }
    .kpi-value {
      font-size:.98rem;
      font-weight:700;
      color:var(--white);
      margin-bottom:3px;
      line-height:1.2;
    }
    .kpi-diff { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .dv { font-size:.56rem; font-weight:600; }
    .dv.up { color:var(--green); } .dv.dn { color:var(--red); } .dv.fl { color:var(--muted); }
    .dp { font-size:.52rem; font-weight:600; padding:1px 4px; border-radius:7px; }
    .dp.up { background:rgba(34,197,94,.15); color:var(--green); }
    .dp.dn { background:rgba(239,68,68,.15); color:var(--red); }
    .dp.fl { background:rgba(176,184,200,.12); color:var(--muted); }
    .kpi-sub { font-size:.5rem; color:var(--muted); margin-left:auto; }

    .charts-panel-wrap { margin-bottom:14px; }
    .chart-panel {
      background:var(--bg2);
      border:1px solid rgba(255,255,255,.07);
      border-radius:10px;
      padding:8px 12px 10px;
    }
    .chart-overline { display:none; }

    .chart-head { display:flex; align-items:center; justify-content:flex-start; gap:8px; margin-bottom:6px; }
    .chart-title {
      font-size:.62rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.07em; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    }
    .chart-accent { width:10px; height:3px; border-radius:2px; background:var(--blue); }
    .chart-sub { font-size:.51rem; color:var(--muted); margin-left:auto; text-transform:none; }

    .chart-wrap { height:148px; position:relative; touch-action:pan-y; }
    .chart-ranges { display:flex; gap:5px; margin-bottom:6px; }

    .range-btn {
      font-size:.58rem; font-weight:700; padding:3px 8px; border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.05); color:var(--muted); cursor:pointer;
      transition:all .2s;
    }
    .range-btn.active { background:rgba(59,130,246,.2); border-color:var(--blue); color:var(--white); }

    .chart-nav-bottom{
      margin-top:8px;
      display:flex;
      justify-content:flex-end;
      gap:6px;
    }
    .chart-nav-btn{
      width:26px; height:26px; border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.05);
      color:var(--white); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .chart-nav-btn:hover{ background:rgba(59,130,246,.2); border-color:var(--blue); }

    .news-panel { background:rgba(59,130,246,.07); border:1px solid rgba(59,130,246,.2); border-radius:10px; padding:12px 16px; }
    .news-title { font-size:.65rem; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.07em; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .news-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ni { display:flex; align-items:flex-start; gap:7px; padding:7px 9px; border-radius:7px; background:rgba(255,255,255,.04); border-left:2px solid var(--blue); }
    .ni.o, .ni.g, .ni.p { border-left-color:var(--blue); }
    .ni-ico { font-size:.68rem; margin-top:2px; }
    .ni-txt { font-size:.7rem; line-height:1.4; }
    .ni-src { color:var(--muted); font-size:.6rem; margin-top:2px; }

    /* Footer with logo left + sources right */
    .dash-footer {
      background:rgba(255,255,255,.02);
      border-top:1px solid rgba(255,255,255,.05);
      padding:8px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .footer-logo{
      height:20px;
      width:auto;
      display:block;
      opacity:.95;
    }
    .footer-text{
      font-size:.57rem;
      color:var(--muted);
      text-align:right;
    }

    /* Siwa FAB: 30% smaller by default */
    #siwa-fab {
      position:fixed; bottom:24px; right:24px; z-index:9999;
      width:66px; height:66px; border-radius:50%; cursor:pointer;
      border:3px solid rgba(59,130,246,.6);
      box-shadow:0 4px 20px rgba(59,130,246,.4);
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#1d4ed8,#3b82f6);
      font-size:2rem;
      overflow:hidden;
      transform:scale(.70);
      transform-origin:bottom right;
      transition:transform .2s ease, box-shadow .2s ease;
    }
    /* back to actual/original size when open */
    #siwa-fab.expanded{
      transform:scale(1);
      box-shadow:0 6px 24px rgba(59,130,246,.55);
    }

    #siwa-avatar-fab{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
    #siwa-notif {
      position:absolute; top:-3px; right:-3px; width:18px; height:18px; border-radius:50%;
      background:#ef4444; border:2px solid var(--bg); display:none; align-items:center; justify-content:center;
      font-size:.58rem; font-weight:700; color:#fff;
    }

    #siwa-panel {
      position:fixed; bottom:100px; right:24px; z-index:9998;
      width:340px; background:var(--bg2); border:1px solid rgba(59,130,246,.25);
      border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.6);
      display:none; flex-direction:column; overflow:hidden;
    }
    #siwa-panel.open { display:flex; }

    #siwa-panel.menu-visible {
      box-shadow:0 0 0 1px rgba(59,130,246,.2), 0 0 36px rgba(59,130,246,.25), 0 20px 60px rgba(0,0,0,.6);
      border-color:rgba(59,130,246,.45);
    }
    #siwa-panel:not(.menu-visible){
      box-shadow:0 20px 60px rgba(0,0,0,.6);
      border-color:rgba(59,130,246,.25);
    }

    #siwa-header {
      background:linear-gradient(135deg,#1a1a2e,#16213e);
      border-bottom:2px solid var(--blue);
      padding:12px 16px; display:flex; align-items:center; gap:10px;
    }
    #siwa-header-avatar{
      width:38px; height:38px; border-radius:50%; object-fit:cover;
      border:2px solid rgba(59,130,246,.6); flex-shrink:0;
    }
    #siwa-header-info h4 { font-size:.88rem; font-weight:700; margin:0; }
    #siwa-header-info p { font-size:.65rem; color:var(--green); margin:0; }
    #siwa-close,#siwa-back { background:none; border:none; color:var(--muted); cursor:pointer; }

    #siwa-menu { padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.06); }
    #siwa-menu-title { font-size:.65rem; color:var(--muted); font-weight:600; text-transform:uppercase; margin-bottom:10px; }
    .siwa-menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .siwa-menu-btn {
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
      color:var(--white); padding:9px 12px; border-radius:10px;
      font-size:.75rem; font-weight:600; cursor:pointer;
    }
    .siwa-menu-btn:hover { background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.35); }
    .siwa-menu-btn.active { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.45); box-shadow:0 0 0 1px rgba(59,130,246,.16); }
    .siwa-menu-btn.pregunta { grid-column:1/-1; background:rgba(167,139,250,.1); border-color:rgba(167,139,250,.3); color:var(--purple); }

    #siwa-sector-label { padding:6px 16px; background:rgba(59,130,246,.08); border-bottom:1px solid rgba(255,255,255,.05); font-size:.63rem; display:none; }
    #siwa-sector-label span { color:var(--blue); font-weight:700; }

    #siwa-msgs { flex:1; padding:12px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px; max-height:260px; }
    .sw-msg { display:flex; gap:8px; }
    .sw-msg.user { flex-direction:row-reverse; }
    .sw-bubble { max-width:84%; padding:8px 12px; border-radius:14px; font-size:.78rem; line-height:1.5; }
    .sw-msg.bot .sw-bubble { background:var(--bg3); border:1px solid rgba(255,255,255,.07); }
    .sw-msg.user .sw-bubble { background:linear-gradient(135deg,#1d4ed8,var(--blue)); }
    .sw-time { font-size:.57rem; color:#475569; margin-top:2px; }
    .sw-sugs { display:flex; flex-wrap:wrap; gap:5px; }
    .sw-sug { background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.25); color:var(--blue); padding:4px 9px; border-radius:14px; font-size:.68rem; cursor:pointer; }

    #siwa-input-area { padding:10px 14px; border-top:1px solid rgba(255,255,255,.06); display:flex; gap:8px; }
    #siwa-input { flex:1; background:var(--bg3); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:8px 12px; color:var(--white); }
    #siwa-send { width:34px; height:34px; border-radius:10px; background:var(--blue); border:none; color:var(--white); cursor:pointer; }

    #siwa-panel.chat-mode #siwa-menu { display:none; }
    #siwa-panel.chat-mode #siwa-sector-label { display:flex; }
    #siwa-panel:not(.chat-mode) #siwa-sector-label,
    #siwa-panel:not(.chat-mode) #siwa-msgs,
    #siwa-panel:not(.chat-mode) #siwa-input-area { display:none; }

    #siwa-panel.chat-mode #siwa-back { display:inline-flex; align-items:center; gap:6px; }
    #siwa-panel:not(.chat-mode) #siwa-back { display:none; }

    @media(max-width:900px) {
      .news-list { grid-template-columns:1fr; }
      .main { padding:12px 14px 100px; }
    }

    @media(max-width:640px) {
      .top-bar { padding:10px 14px; min-height:auto; align-items:flex-start; gap:8px; flex-direction:column; }
      .top-bar-date { font-size:.68rem; }

      .kpi-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
      .kpi-card { padding:7px 7px; border-radius:8px; }
      .kpi-label { font-size:.46rem; letter-spacing:.02em; line-height:1.15; }
      .kpi-value { font-size:.72rem; margin-bottom:2px; line-height:1.15; }
      .dv { font-size:.5rem; }
      .dp { font-size:.46rem; padding:1px 3px; }
      .kpi-sub { font-size:.44rem; margin-left:0; width:100%; }

      .chart-wrap { height:136px; }
    }

    @media(max-width:480px) {
      #siwa-panel { width:calc(100vw - 32px); right:16px; bottom:90px; }
      #siwa-fab { bottom:16px; right:16px; }

      .kpi-grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; }
      .kpi-card { padding:6px 6px; }
      .kpi-value { font-size:.68rem; }

      .chart-wrap { height:128px; }
      .chart-nav-btn{ width:24px; height:24px; }

      .footer-logo{ height:18px; }
      .footer-text{ font-size:.52rem; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-bar-bar"></div>
      <div class="top-bar-title" id="dashTitle">Dashboard Económico — <span>Chile</span></div>
    </div>
    <div class="top-bar-date" id="fechaHoy"></div>
  </div>

  <div class="main">
    <div class="kpi-grid"></div>

    <div class="charts-panel-wrap">
      <div class="chart-panel">
        <div class="chart-overline">Indicador seleccionado</div>
        <div id="chartsTrack"></div>
      </div>
    </div>

    <div class="news-panel">
      <div class="news-title"><i class="fas fa-newspaper"></i>Noticias Económicas del Día</div>
      <div class="news-list"></div>
    </div>
  </div>

  <div class="dash-footer">
    <img src="Logo Blanco Alternativo.png" alt="Logo" class="footer-logo">
    <div class="footer-text">Fuentes: Banco Central de Chile · mindicador.cl · prensa económica</div>
  </div>

  <div id="siwa-fab" onclick="siwaToggle()" title="Hablar con Siwa">
    <img src="Siwa.png" alt="Siwa" id="siwa-avatar-fab" />
    <div id="siwa-notif">1</div>
  </div>

  <div id="siwa-panel">
    <div id="siwa-header">
      <img src="Siwa.png" alt="Siwa" id="siwa-header-avatar" />
      <div id="siwa-header-info">
        <h4>Siwa — Analista Económica</h4>
        <p>En línea · Chile</p>
      </div>
      <button id="siwa-back" onclick="siwaVolverMenu()"><i class="fas fa-arrow-left"></i> Menú</button>
      <button id="siwa-close" onclick="siwaClose()"><i class="fas fa-times"></i></button>
    </div>

    <div id="siwa-menu">
      <div id="siwa-menu-title">¿Qué necesitas?</div>
      <div class="siwa-menu-grid">
        <button id="btn-mineria" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('mineria')">⛏️ Minería</button>
        <button id="btn-inmobiliario" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('inmobiliario')">🏠 Inmobiliario</button>
        <button id="btn-financiero" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('financiero')">🏦 Financiero</button>
        <button id="btn-retail" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('retail')">🛒 Retail</button>
        <button id="btn-energia" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('energia')">⚡ Energía</button>
        <button id="btn-general" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('general')">🌐 General</button>
        <button class="siwa-menu-btn pregunta" onclick="siwaModoPregunta()"><i class="fas fa-comment-dots"></i> ¿Quieres hacer una pregunta?</button>
      </div>
    </div>

    <div id="siwa-sector-label">
      <i class="fas fa-chart-bar"></i> Sector activo: <span id="siwa-sector-name">General</span>
    </div>

    <div id="siwa-msgs"></div>

    <div id="siwa-input-area">
      <input id="siwa-input" placeholder="Escribe tu pregunta..." type="text" onkeypress="if(event.key==='Enter') siwaEnviar()"/>
      <button id="siwa-send" onclick="siwaEnviar()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var hoy = new Date();
    document.getElementById('fechaHoy').textContent = hoy.getDate() + ' de ' + meses[hoy.getMonth()] + ' de ' + hoy.getFullYear();

    var SECTORES = {
      general:{label:'General',icon:'🌐',desc:'Panorama macroeconómico general de Chile.'},
      mineria:{label:'Minería',icon:'⛏️',desc:'Sector minero: foco en cobre, dólar, costos e inversión.'},
      inmobiliario:{label:'Inmobiliario',icon:'🏠',desc:'Sector inmobiliario: UF, TPM, inflación y crédito.'},
      financiero:{label:'Financiero',icon:'🏦',desc:'Sector financiero: TPM, EMBI, tipo de cambio y tasas.'},
      retail:{label:'Retail/Consumo',icon:'🛒',desc:'Retail: IPC, empleo, importaciones y confianza consumidor.'},
      energia:{label:'Energía',icon:'⚡',desc:'Energía: petróleo, dólar, IPC y costos marginales.'}
    };
    var SECTOR_ACTUAL = 'general';

    var SECTOR_KPIS = {
      general:[
        {label:'USD/CLP observado',val:'$913,20',dv:'up',dvt:'+$1,20',dp:'up',dpt:'+0,13%',sub:'YTD +3,2% · 12m +5,6%'},
        {label:'IPC',val:'-0,2% m/m',dv:'dn',dvt:'-0,2 pp',dp:'up',dpt:'Acum +2,1%',sub:'12m +3,8%'},
        {label:'UF',val:'$40.851,38',dv:'up',dvt:'+$1,32',dp:'up',dpt:'+0,38%',sub:'variación mensual'},
        {label:'IMACEC',val:'+1,8% a/a',dv:'up',dvt:'+0,3 pp',dp:'up',dpt:'Desest. +0,2%',sub:'serie desestacionalizada'},
        {label:'Desempleo nacional',val:'8,6%',dv:'dn',dvt:'-0,1 pp',dp:'up',dpt:'Mejora',sub:'trimestre móvil'},
        {label:'Riesgo país Chile',val:'89 pb',dv:'fl',dvt:'0 pb',dp:'fl',dpt:'EMBI',sub:'CDS 5Y: 63 pb'},
        {label:'TPM',val:'4,50%',dv:'fl',dvt:'0 pb',dp:'dn',dpt:'12m: 4,25%',sub:'expectativa mercado'},
        {label:'PIB real',val:'+0,7% t/t',dv:'up',dvt:'+0,2 pp',dp:'up',dpt:'+1,9% a/a',sub:'crecimiento trimestral'}
      ]
    };

    var SECTOR_NOTICIAS = {
      general:[
        {cls:'o',ico:'globe',tit:'EE.UU. incluye a Chile en lista comercial',desc:'Autoridades reaccionan al reporte.',fte:'Prensa - Hoy'},
        {cls:'g',ico:'home',tit:'Fogaes reactiva hipotecarios',desc:'Mayor cobertura y cupos para vivienda.',fte:'Economía - Hoy'}
      ]
    };

    var DEFAULT_CHART_COLOR = '#3b82f6';
    var CHART_RANGE = '1m';
    var CHART_ACTIVE_INDEX = 0;
    var CHART_INSTANCES = [];
    var RANGE_LABELS = {'5d':'5 días','1m':'1 mes','12m':'12 meses'};

    function renderKPIs(sector){
      var kpis = SECTOR_KPIS[sector] || SECTOR_KPIS.general;
      var grid = document.querySelector('.kpi-grid');
      grid.innerHTML = '';
      kpis.forEach(function(k,idx){
        var arrow = k.dv==='up' ? 'arrow-up' : k.dv==='dn' ? 'arrow-down' : 'minus';
        var activeCls = idx===CHART_ACTIVE_INDEX ? ' active' : '';
        grid.innerHTML += '<button type="button" class="kpi-card kpi-card-btn'+activeCls+'" onclick="setActiveChart('+idx+')" aria-pressed="'+(idx===CHART_ACTIVE_INDEX?'true':'false')+'"><div class="kpi-label">'+k.label+'</div><div class="kpi-value">'+k.val+'</div><div class="kpi-diff"><span class="dv '+k.dv+'"><i class="fas fa-'+arrow+'"></i> '+k.dvt+'</span><span class="dp '+k.dp+'">'+k.dpt+'</span><span class="kpi-sub">'+k.sub+'</span></div></button>';
      });
    }

    function syncActiveKPIState(){
      document.querySelectorAll('.kpi-card-btn').forEach(function(card,idx){
        var isActive = idx===CHART_ACTIVE_INDEX;
        card.classList.toggle('active',isActive);
        card.setAttribute('aria-pressed',isActive ? 'true' : 'false');
      });
    }

    function renderNoticias(sector){
      var nots = SECTOR_NOTICIAS[sector] || SECTOR_NOTICIAS.general;
      var list = document.querySelector('.news-list');
      list.innerHTML = '';
      nots.forEach(function(n){
        var cls = n.cls ? ' '+n.cls : '';
        list.innerHTML += '<div class="ni'+cls+'"><i class="fas fa-'+n.ico+' ni-ico"></i><div class="ni-txt"><strong>'+n.tit+'</strong> — '+n.desc+'<div class="ni-src">'+n.fte+'</div></div></div>';
      });
    }

    function setSector(sector){
      SECTOR_ACTUAL = sector;
      CHART_ACTIVE_INDEX = 0;
      var nombres = {general:'Chile'};
      var t = document.getElementById('dashTitle');
      t.innerHTML = 'Dashboard Económico — <span>' + (nombres[sector]||'Chile') + '</span>';
      renderKPIs(sector); renderNoticias(sector); renderCharts(sector);
    }

    var baseOpts = {
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{ticks:{color:'#94a3b8',font:{size:8}}},y:{ticks:{color:'#94a3b8',font:{size:8}}}}
    };

    var SECTOR_CHARTS = {
      general:[
        {title:'USD/CLP observado',sub:'nivel y variación',color:'#3b82f6',base:913,drift:0.6,amp:1.6},
        {title:'IPC',sub:'variación mensual/anual',color:'#3b82f6',base:3.8,drift:-0.03,amp:0.2},
        {title:'UF',sub:'valor diario',color:'#3b82f6',base:40850,drift:3.2,amp:6},
        {title:'IMACEC',sub:'variación interanual',color:'#3b82f6',base:1.8,drift:0.05,amp:0.18},
        {title:'Desempleo nacional',sub:'trimestre móvil',color:'#3b82f6',base:8.6,drift:-0.02,amp:0.1},
        {title:'Riesgo país Chile',sub:'EMBI / CDS 5Y',color:'#3b82f6',base:89,drift:-0.4,amp:1.8},
        {title:'TPM',sub:'nivel y expectativa 12m',color:'#3b82f6',base:4.5,drift:-0.02,amp:0.06},
        {title:'PIB real',sub:'trimestral e interanual',color:'#3b82f6',base:1.9,drift:0.02,amp:0.15}
      ]
    };

    function getRangeLabels(range){
      if(range==='12m'){
        var mesesCortos=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        var mLabels=[];
        var baseMes=new Date();
        for(var i=11;i>=0;i--){
          var md=new Date(baseMes);
          md.setDate(1);
          md.setMonth(baseMes.getMonth()-i);
          mLabels.push(mesesCortos[md.getMonth()]);
        }
        return mLabels;
      }
      if(range==='5d'){
        var days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        var labels=[];
        var baseDia=new Date();
        for(var j=4;j>=0;j--){
          var d=new Date(baseDia);
          d.setDate(baseDia.getDate()-j);
          labels.push(days[d.getDay()]);
        }
        return labels;
      }
      var m=[];
      var baseMesDia=new Date();
      for(var k=5;k>=0;k--){
        var dm=new Date(baseMesDia);
        dm.setDate(baseMesDia.getDate()-(k*6));
        m.push(dm.getDate()+'/'+(dm.getMonth()+1));
      }
      return m;
    }

    function buildSeries(base,drift,amp,points){
      var out=[];
      for(var i=0;i<points;i++){
        var val=base + (drift*i) + (Math.sin(i*1.4)*amp);
        var digits=base>=100 ? 1 : base>=10 ? 2 : 3;
        out.push(Number(val.toFixed(digits)));
      }
      return out;
    }

    function destroyCharts(){
      CHART_INSTANCES.forEach(function(c){ if(c&&c.destroy) c.destroy(); });
      CHART_INSTANCES=[];
    }

    function setChartRange(range){
      CHART_RANGE=range;
      renderCharts(SECTOR_ACTUAL,true);
    }

    function setActiveChart(index){
      CHART_ACTIVE_INDEX=index;
      syncActiveKPIState();
      renderCharts(SECTOR_ACTUAL,true);
    }

    function prevChart(){
      var defs = SECTOR_CHARTS[SECTOR_ACTUAL] || SECTOR_CHARTS.general;
      CHART_ACTIVE_INDEX = (CHART_ACTIVE_INDEX - 1 + defs.length) % defs.length;
      syncActiveKPIState();
      renderCharts(SECTOR_ACTUAL,true);
    }

    function nextChart(){
      var defs = SECTOR_CHARTS[SECTOR_ACTUAL] || SECTOR_CHARTS.general;
      CHART_ACTIVE_INDEX = (CHART_ACTIVE_INDEX + 1) % defs.length;
      syncActiveKPIState();
      renderCharts(SECTOR_ACTUAL,true);
    }

    function escapeHtml(text){
      return String(text)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function getSafeColor(color){
      return /^#(?:[0-9a-fA-F]{3}){1,2}$/.test(color||'') ? color : DEFAULT_CHART_COLOR;
    }

    function attachChartSwipe(el){
      if(!el) return;
      var startX = 0, startY = 0, touching = false;
      el.addEventListener('touchstart', function(e){
        if(!e.touches || !e.touches.length) return;
        touching = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, {passive:true});
      el.addEventListener('touchend', function(e){
        if(!touching || !e.changedTouches || !e.changedTouches.length) return;
        touching = false;
        var dx = e.changedTouches[0].clientX - startX;
        var dy = e.changedTouches[0].clientY - startY;
        if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
          if(dx < 0) nextChart();
          else prevChart();
        }
      }, {passive:true});
    }

    function renderCharts(sector,preserveIndex){
      var defs=SECTOR_CHARTS[sector] || SECTOR_CHARTS.general;
      if(!defs.length) defs=SECTOR_CHARTS.general;

      var track=document.getElementById('chartsTrack');
      destroyCharts();

      if(!preserveIndex || CHART_ACTIVE_INDEX>defs.length-1) CHART_ACTIVE_INDEX=0;

      var def=defs[CHART_ACTIVE_INDEX] || defs[0];
      var safeColor=getSafeColor(def.color);

      var btns=['5d','1m','12m'].map(function(r){
        var cls=r===CHART_RANGE ? 'range-btn active' : 'range-btn';
        return '<button class="'+cls+'" onclick="setChartRange(\''+r+'\')">'+RANGE_LABELS[r]+'</button>';
      }).join('');

      track.innerHTML =
        '<div class="chart-head">' +
          '<div class="chart-title">' +
            '<div class="chart-accent" style="background:'+safeColor+'"></div>' +
            escapeHtml(def.title) +
            '<span class="chart-sub">'+escapeHtml(def.sub)+'</span>' +
          '</div>' +
        '</div>' +
        '<div class="chart-ranges">'+btns+'</div>' +
        '<div class="chart-wrap" id="chartSwipeArea"><canvas id="chart-'+sector+'-'+CHART_ACTIVE_INDEX+'"></canvas></div>' +
        '<div class="chart-nav-bottom">' +
          '<button class="chart-nav-btn" onclick="prevChart()" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>' +
          '<button class="chart-nav-btn" onclick="nextChart()" aria-label="Siguiente"><i class="fas fa-chevron-right"></i></button>' +
        '</div>';

      var labels=getRangeLabels(CHART_RANGE);
      var data=buildSeries(def.base,def.drift,def.amp,labels.length);
      var canvas=document.getElementById('chart-'+sector+'-'+CHART_ACTIVE_INDEX);

      CHART_INSTANCES.push(new Chart(canvas,{
        type:'line',
        data:{labels:labels,datasets:[{data:data,borderColor:safeColor,backgroundColor:safeColor+'33',tension:.35,fill:true,borderWidth:2,pointRadius:2}]},
        options:baseOpts
      }));

      attachChartSwipe(document.getElementById('chartSwipeArea'));
    }

    var siwaOpen=false, siwaChatMode=false;
    var SIWA_AGENT_ENDPOINT='/api/siwa-ask';
    var SIWA_USE_AGENT_FOR_OPEN=true;

    function siwaShowMenu(){
      siwaChatMode=false;
      var panel=document.getElementById('siwa-panel');
      panel.classList.remove('chat-mode');
      panel.classList.add('menu-visible');
      document.getElementById('siwa-msgs').innerHTML='';
    }

    function siwaToggle(){
      siwaOpen=!siwaOpen;
      var p=document.getElementById('siwa-panel');
      var fab=document.getElementById('siwa-fab');
      if(siwaOpen){
        p.classList.add('open');
        fab.classList.add('expanded');
        siwaShowMenu();
        document.getElementById('siwa-notif').style.display='none';
      } else {
        p.classList.remove('open');
        fab.classList.remove('expanded');
      }
    }

    function siwaClose(){
      siwaOpen=false;
      var p=document.getElementById('siwa-panel');
      var fab=document.getElementById('siwa-fab');
      p.classList.remove('open');
      p.classList.remove('menu-visible');
      fab.classList.remove('expanded');
    }

    function siwaVolverMenu(){
      siwaShowMenu();
    }

    function siwaModoPregunta(){
      siwaChatMode=true;
      var panel=document.getElementById('siwa-panel');
      panel.classList.add('chat-mode');
      panel.classList.remove('menu-visible');
      document.getElementById('siwa-sector-name').textContent=SECTORES[SECTOR_ACTUAL].label;
      document.getElementById('siwa-msgs').innerHTML='';
      siwaAddBot('¡Hola! Soy <strong>Siwa</strong>. Mantengo el contexto del sector seleccionado y puedo consultar el agente Copilot para preguntas abiertas.');
      setTimeout(function(){
        siwaAddSugs(['¿Cómo está el dólar?','¿Qué es el EMBI?','Analiza riesgos del sector actual','Perspectiva 6 meses']);
      },300);
    }

    function siwaSelSector(sector){
      SECTOR_ACTUAL=sector;
      setSector(sector);

      siwaChatMode=true;
      var panel=document.getElementById('siwa-panel');
      panel.classList.add('chat-mode');
      panel.classList.remove('menu-visible');
      document.getElementById('siwa-sector-name').textContent=SECTORES[sector].label;
      document.getElementById('siwa-msgs').innerHTML='';

      var s=SECTORES[sector];
      siwaAddBot('Sector <strong>'+s.icon+' '+s.label+'</strong> seleccionado.<br><br>'+s.desc+'<br><br><small style="color:#94a3b8">Las preguntas abiertas se responderán con análisis del agente Copilot cuando corresponda.</small>');
      setTimeout(function(){
        siwaAddSugs(['¿Cómo afecta al sector?','¿Cuáles son los riesgos?','Perspectivas futuras','¿Qué estrategia recomiendas?']);
      },350);
    }

    function siwaAddBot(html){
      var msgs=document.getElementById('siwa-msgs');
      var d=document.createElement('div');
      d.className='sw-msg bot';
      d.innerHTML='<div><div class="sw-bubble">'+html+'</div><div class="sw-time">'+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})+'</div></div>';
      msgs.appendChild(d);
      msgs.scrollTop=msgs.scrollHeight;
    }

    function siwaAddSugs(sugs){
      var msgs=document.getElementById('siwa-msgs');
      var d=document.createElement('div');
      d.className='sw-msg bot';
      d.innerHTML='<div class="sw-sugs">'+sugs.map(function(s){return '<button class="sw-sug">'+s+'</button>';}).join('')+'</div>';
      msgs.appendChild(d);
      msgs.scrollTop=msgs.scrollHeight;
    }

    function siwaEnviar(){}

    setSector('general');
    setTimeout(function(){
      if(!siwaOpen) document.getElementById('siwa-notif').style.display='flex';
    },2000);
  </script>
</body>
