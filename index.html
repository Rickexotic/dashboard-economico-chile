<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Dashboard Económico Chile</title>
  <meta name="description" content="Dashboard ejecutivo con indicadores económicos de Chile en tiempo real: Dólar, Cobre, UF, EMBI, IPC, TPM y más. Con asistente virtual Siwa.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0f172a; --bg2:#1e293b; --bg3:#16213e;
      --blue:#3b82f6; --green:#22c55e; --orange:#f97316;
      --red:#ef4444; --purple:#a78bfa; --white:#fff; --muted:#94a3b8;
      --dot:#64748b;
    }

    body{
      font-family:'Segoe UI',sans-serif;
      background:var(--bg);
      color:var(--white);
      min-height:100vh;
      overflow:hidden;
    }

    /* =========================
       HORIZONTAL PAGER
       ========================= */
    .pager{
      width:100vw;
      height:100vh;
      display:flex;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scroll-behavior:smooth;
      scrollbar-width:none;
    }
    .pager::-webkit-scrollbar{ display:none; }

    .page{
      flex:0 0 100vw;
      width:100vw;
      height:100vh;
      scroll-snap-align:start;
      overflow-y:auto;
      overflow-x:hidden;
      background:var(--bg);
      position:relative;
      scrollbar-width:none;
      padding-bottom:58px; /* room for dots */
    }
    .page::-webkit-scrollbar{ display:none; }

    /* Subtle dots */
    .page-dots{
      position:fixed;
      left:50%;
      bottom:8px;
      transform:translateX(-50%);
      z-index:10001;
      display:flex;
      align-items:center;
      gap:7px;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(15,23,42,.35);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(4px);
    }
    .page-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      border:none;
      background:rgba(148,163,184,.55);
      opacity:.65;
      cursor:pointer;
      transition:all .2s ease;
    }
    .page-dot.active{
      opacity:.9;
      background:rgba(148,163,184,.95);
      transform:scale(1.05);
      box-shadow:none;
    }

    .top-bar {
      background:rgba(15,23,42,.96);
      border-bottom:1px solid rgba(59,130,246,.25);
      padding:10px 20px;
      min-height:60px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      position:sticky;
      top:0;
      z-index:100;
    }

    .top-bar-left {
      display:flex;
      align-items:flex-start;
      gap:10px;
      min-width:0;
      flex:1;
    }

    .top-bar-bar {
      width:3px;
      height:34px;
      background:var(--blue);
      border-radius:999px;
      margin-top:1px;
      flex-shrink:0;
    }

    .top-bar-title-wrap{
      display:flex;
      flex-direction:column;
      min-width:0;
      gap:2px;
      width:100%;
    }

    .top-bar-title {
      font-size:1rem;
      font-weight:800;
      color:var(--white);
      line-height:1.1;
      white-space:nowrap;
    }

    .top-bar-subrow{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:16px;
      width:100%;
      min-width:0;
    }

    .top-bar-sector{
      font-size:1rem;
      font-weight:800;
      color:var(--blue);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .top-bar-date {
      font-size:.72rem;
      color:var(--muted);
      white-space:nowrap;
      margin-left:auto;
      text-align:right;
    }

    .main { padding:16px 24px 24px; }

    /* =========================
       KPI - STOCK STYLE, 3 VISIBLE
       ========================= */
    .kpi-grid{
      display:flex;
      gap:8px;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      padding-bottom:4px;
      margin-bottom:14px;
      scrollbar-width:none;
    }
    .kpi-grid::-webkit-scrollbar{ display:none; }

    .kpi-card{
      flex:0 0 calc((100% - 16px) / 3);
      min-width:calc((100% - 16px) / 3);
      max-width:calc((100% - 16px) / 3);
      scroll-snap-align:start;

      background:transparent;
      border:1px solid rgba(255,255,255,.08);
      border-radius:10px;
      padding:8px 8px 9px;
      text-align:left;
      display:flex;
      flex-direction:column;
      min-height:96px;
      transition:border-color .2s, background .2s, transform .2s;
    }
    .kpi-card:hover{ transform:translateY(-1px); }
    .kpi-card-btn{ cursor:pointer; font:inherit; width:100%; }

    .kpi-card.active{
      background:rgba(255,255,255,.03);
      border-color:rgba(148,163,184,.45);
      box-shadow:none;
    }

    .kpi-label{
      font-size:.56rem;
      color:#94a3b8;
      text-transform:uppercase;
      letter-spacing:.03em;
      font-weight:600;
      line-height:1.15;
      margin-bottom:5px;
      min-height:2.3em;
      display:flex;
      align-items:flex-start;
    }

    .kpi-value{
      font-size:.86rem;
      font-weight:700;
      color:#e2e8f0;
      line-height:1.15;
      margin-bottom:5px;
      min-height:1.2em;
      display:flex;
      align-items:flex-end;
    }

    .kpi-diff{
      margin-top:auto;
      display:flex;
      align-items:center;
      gap:4px;
      flex-wrap:wrap;
      min-height:1.2em;
    }

    .dv{ font-size:.56rem; font-weight:600; white-space:nowrap; }
    .dv.up{ color:var(--green); }
    .dv.dn{ color:var(--red); }
    .dv.fl{ color:#94a3b8; }

    .dp{
      font-size:.52rem;
      font-weight:600;
      white-space:nowrap;
      background:transparent;
      padding:0;
      border-radius:0;
    }
    .dp.up{ color:var(--green); }
    .dp.dn{ color:var(--red); }
    .dp.fl{ color:#94a3b8; }

    .kpi-sub{
      font-size:.5rem;
      color:#64748b;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
      margin-left:0;
    }

    .charts-panel-wrap { margin-bottom:14px; }
    .chart-panel {
      background:var(--bg2);
      border:1px solid rgba(255,255,255,.07);
      border-radius:10px;
      padding:10px 12px 10px;
    }
    .chart-overline { display:none; }

    .chart-head { display:flex; align-items:center; justify-content:flex-start; gap:8px; margin-bottom:12px; }
    .chart-title {
      font-size:.62rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.07em; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    }
    .chart-accent { width:10px; height:3px; border-radius:2px; background:var(--blue); }
    .chart-sub { font-size:.51rem; color:var(--muted); margin-left:auto; text-transform:none; }

    .chart-wrap { height:152px; position:relative; touch-action:pan-y; margin-top:10px; }

    .range-btn {
      font-size:.58rem; font-weight:700; padding:4px 9px; border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.05); color:var(--muted); cursor:pointer;
      transition:all .2s;
    }
    .range-btn.active { background:rgba(59,130,246,.2); border-color:var(--blue); color:var(--white); }

    .chart-nav-bottom{
      margin-top:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .chart-range-bottom{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      justify-content:flex-start;
    }

    .chart-nav-right{
      display:flex;
      gap:6px;
      justify-content:flex-end;
      flex-shrink:0;
    }

    .chart-nav-btn{
      width:26px; height:26px; border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.05);
      color:var(--white); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
    }
    .chart-nav-btn:hover{ background:rgba(59,130,246,.2); border-color:var(--blue); }

    .news-panel { background:rgba(59,130,246,.07); border:1px solid rgba(59,130,246,.2); border-radius:10px; padding:12px 16px; }
    .news-title { font-size:.65rem; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.07em; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .news-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ni { display:flex; align-items:flex-start; gap:7px; padding:7px 9px; border-radius:7px; background:rgba(255,255,255,.04); border-left:2px solid var(--blue); }
    .ni.o, .ni.g, .ni.p { border-left-color:var(--blue); }
    .ni-ico { font-size:.68rem; margin-top:2px; }
    .ni-txt { font-size:.7rem; line-height:1.4; }
    .ni-src { color:var(--muted); font-size:.6rem; margin-top:2px; }

    .dash-footer {
      background:rgba(255,255,255,.02);
      border-top:1px solid rgba(255,255,255,.05);
      padding:8px 24px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      margin-top:8px;
    }
    .footer-logo{
      height:33.6px;
      width:auto;
      display:block;
      opacity:.95;
    }

    /* =========================
       STOCKS PAGE
       ========================= */
    .stocks-main{ padding:8px 10px 16px; }
    .stock-list{ display:flex; flex-direction:column; gap:6px; }

    .stock-item{
      background:transparent;
      border-radius:10px;
      padding:10px 8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .stock-left{
      min-width:0;
      display:flex;
      flex-direction:column;
    }
    .stock-symbol{
      font-size:1rem;
      font-weight:700;
      color:#e2e8f0;
      line-height:1.1;
      letter-spacing:.01em;
    }
    .stock-name{
      font-size:.62rem;
      color:#64748b;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:180px;
    }
    .stock-right{
      text-align:right;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:2px;
    }
    .stock-price{
      font-size:1rem;
      font-weight:700;
      color:#e2e8f0;
      line-height:1.1;
    }
    .stock-change{
      font-size:.66rem;
      font-weight:600;
      display:flex;
      align-items:center;
      gap:4px;
    }
    .stock-change.up{ color:var(--green); }
    .stock-change.down{ color:var(--red); }

    #siwa-fab {
      position:fixed; bottom:34px; right:24px; z-index:9999;
      width:66px; height:66px; border-radius:50%; cursor:pointer;
      border:3px solid rgba(59,130,246,.6);
      box-shadow:0 4px 20px rgba(59,130,246,.4);
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#1d4ed8,#3b82f6);
      font-size:2rem;
      overflow:hidden;
      transform:scale(.70);
      transform-origin:bottom right;
      transition:transform .2s ease, box-shadow .2s ease;
    }
    #siwa-fab.expanded{
      transform:scale(1);
      box-shadow:0 6px 24px rgba(59,130,246,.55);
    }

    #siwa-avatar-fab{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
    #siwa-notif {
      position:absolute; top:-3px; right:-3px; width:18px; height:18px; border-radius:50%;
      background:#ef4444; border:2px solid var(--bg); display:none; align-items:center; justify-content:center;
      font-size:.58rem; font-weight:700; color:#fff;
    }

    #siwa-panel {
      position:fixed; bottom:108px; right:24px; z-index:9998;
      width:340px; background:var(--bg2); border:1px solid rgba(59,130,246,.25);
      border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.6);
      display:none; flex-direction:column; overflow:hidden;
    }
    #siwa-panel.open { display:flex; }

    #siwa-panel.menu-visible {
      box-shadow:0 0 0 1px rgba(59,130,246,.2), 0 0 36px rgba(59,130,246,.25), 0 20px 60px rgba(0,0,0,.6);
      border-color:rgba(59,130,246,.45);
    }
    #siwa-panel:not(.menu-visible){
      box-shadow:0 20px 60px rgba(0,0,0,.6);
      border-color:rgba(59,130,246,.25);
    }

    #siwa-header {
      background:linear-gradient(135deg,#1a1a2e,#16213e);
      border-bottom:2px solid var(--blue);
      padding:12px 16px; display:flex; align-items:center; gap:10px;
    }
    #siwa-header-avatar{
      width:38px; height:38px; border-radius:50%; object-fit:cover;
      border:2px solid rgba(59,130,246,.6); flex-shrink:0;
    }
    #siwa-header-info h4 { font-size:.88rem; font-weight:700; margin:0; }
    #siwa-header-info p { font-size:.65rem; color:var(--green); margin:0; }
    #siwa-close,#siwa-back { background:none; border:none; color:var(--muted); cursor:pointer; }

    #siwa-menu { padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.06); }
    #siwa-menu-title { font-size:.65rem; color:var(--muted); font-weight:600; text-transform:uppercase; margin-bottom:10px; }
    .siwa-menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .siwa-menu-btn {
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
      color:var(--white); padding:9px 12px; border-radius:10px;
      font-size:.75rem; font-weight:600; cursor:pointer;
    }
    .siwa-menu-btn:hover { background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.35); }
    .siwa-menu-btn.active { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.45); box-shadow:0 0 0 1px rgba(59,130,246,.16); }
    .siwa-menu-btn.pregunta { grid-column:1/-1; background:rgba(167,139,250,.1); border-color:rgba(167,139,250,.3); color:var(--purple); }

    #siwa-sector-label { padding:6px 16px; background:rgba(59,130,246,.08); border-bottom:1px solid rgba(255,255,255,.05); font-size:.63rem; display:none; }
    #siwa-sector-label span { color:var(--blue); font-weight:700; }

    #siwa-msgs { flex:1; padding:12px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px; max-height:260px; }
    .sw-msg { display:flex; gap:8px; }
    .sw-msg.user { flex-direction:row-reverse; }
    .sw-bubble { max-width:84%; padding:8px 12px; border-radius:14px; font-size:.78rem; line-height:1.5; }
    .sw-msg.bot .sw-bubble { background:var(--bg3); border:1px solid rgba(255,255,255,.07); }
    .sw-msg.user .sw-bubble { background:linear-gradient(135deg,#1d4ed8,var(--blue)); }
    .sw-time { font-size:.57rem; color:#475569; margin-top:2px; }
    .sw-sugs { display:flex; flex-wrap:wrap; gap:5px; }
    .sw-sug { background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.25); color:var(--blue); padding:4px 9px; border-radius:14px; font-size:.68rem; cursor:pointer; }

    #siwa-input-area { padding:10px 14px; border-top:1px solid rgba(255,255,255,.06); display:flex; gap:8px; }
    #siwa-input { flex:1; background:var(--bg3); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:8px 12px; color:var(--white); }
    #siwa-send { width:34px; height:34px; border-radius:10px; background:var(--blue); border:none; color:var(--white); cursor:pointer; }

    #siwa-panel.chat-mode #siwa-menu { display:none; }
    #siwa-panel.chat-mode #siwa-sector-label { display:flex; }
    #siwa-panel:not(.chat-mode) #siwa-sector-label,
    #siwa-panel:not(.chat-mode) #siwa-msgs,
    #siwa-panel:not(.chat-mode) #siwa-input-area { display:none; }

    #siwa-panel.chat-mode #siwa-back { display:inline-flex; align-items:center; gap:6px; }
    #siwa-panel:not(.chat-mode) #siwa-back { display:none; }

    @media(max-width:900px) {
      .news-list { grid-template-columns:1fr; }
      .main { padding:12px 14px 18px; }
    }

    @media(max-width:640px){
      .kpi-card{
        min-height:92px;
        padding:7px 7px 8px;
      }
      .kpi-label{ font-size:.5rem; min-height:2.2em; }
      .kpi-value{ font-size:.74rem; }
      .dv{ font-size:.5rem; }
      .dp{ font-size:.48rem; }
      .kpi-sub{ font-size:.44rem; }

      .stock-name{ max-width:150px; }
      .main{ padding:12px 12px 18px; }
      .stocks-main{ padding:8px 8px 14px; }
      .dash-footer{ padding:8px 12px; }

      #siwa-panel{ width:calc(100vw - 24px); right:12px; }
      #siwa-fab{ right:16px; bottom:34px; }
    }

    @media(max-width:480px){
      .kpi-value{ font-size:.68rem; }
      .stock-symbol{ font-size:.95rem; }
      .stock-price{ font-size:.95rem; }
    }

    .chart-wrap { height:128px; }
    .chart-nav-btn{ width:24px; height:24px; }
    .footer-logo{ height:28.8px; }
  </style>
</head>
<body>
  <div id="pager" class="pager">

    <!-- PAGE 1: DASHBOARD -->
    <section class="page" id="page-dashboard">
      <div class="top-bar">
        <div class="top-bar-left">
          <div class="top-bar-bar"></div>
          <div class="top-bar-title-wrap">
            <div class="top-bar-title" id="mainTitle">Informe Chile</div>
            <div class="top-bar-subrow">
              <div class="top-bar-sector" id="sectorTitle">General</div>
              <div class="top-bar-date" id="fechaHoy"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="main">
        <div class="kpi-grid"></div>

        <div class="charts-panel-wrap">
          <div class="chart-panel">
            <div class="chart-overline">Indicador seleccionado</div>
            <div id="chartsTrack"></div>
          </div>
        </div>

        <div class="news-panel">
          <div class="news-title"><i class="fas fa-newspaper"></i>Noticias Económicas del Día</div>
          <div class="news-list"></div>
        </div>
      </div>

      <div class="dash-footer">
        <img src="Logo Blanco Alternativo.png" alt="Logo" class="footer-logo">
      </div>
    </section>

    <!-- PAGE 2: STOCK MARKET -->
    <section class="page" id="page-stocks">
      <div class="top-bar">
        <div class="top-bar-left">
          <div class="top-bar-bar"></div>
          <div class="top-bar-title-wrap">
            <div class="top-bar-title">Informe Chile</div>
            <div class="top-bar-subrow">
              <div class="top-bar-sector">Market</div>
              <div class="top-bar-date" id="fechaHoyStocks"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="stocks-main">
        <div id="stockList" class="stock-list"></div>
      </div>

      <div class="dash-footer">
        <img src="Logo Blanco Alternativo.png" alt="Logo" class="footer-logo">
      </div>
    </section>
  </div>

  <!-- subtle dots -->
  <div class="page-dots" aria-label="Indicador de página">
    <button class="page-dot active" data-page="0" aria-label="Ir a página 1"></button>
    <button class="page-dot" data-page="1" aria-label="Ir a página 2"></button>
  </div>

  <!-- SIWA -->
  <div id="siwa-fab" onclick="siwaToggle()" title="Hablar con Siwa">
    <img src="Siwa.png" alt="Siwa" id="siwa-avatar-fab" />
    <div id="siwa-notif">1</div>
  </div>

  <div id="siwa-panel">
    <div id="siwa-header">
      <img src="Siwa.png" alt="Siwa" id="siwa-header-avatar" />
      <div id="siwa-header-info">
        <h4>Siwa — Analista Económica</h4>
        <p>En línea · Chile</p>
      </div>
      <button id="siwa-back" onclick="siwaVolverMenu()"><i class="fas fa-arrow-left"></i> Menú</button>
      <button id="siwa-close" onclick="siwaClose()"><i class="fas fa-times"></i></button>
    </div>

    <div id="siwa-menu">
      <div id="siwa-menu-title">¿Qué necesitas?</div>
      <div class="siwa-menu-grid">
        <button id="btn-mineria" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('mineria')">⛏️ Minería</button>
        <button id="btn-inmobiliario" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('inmobiliario')">🏠 Inmobiliario</button>
        <button id="btn-financiero" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('financiero')">🏦 Financiero</button>
        <button id="btn-retail" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('retail')">🛒 Retail</button>

        if(idx !== activePage) setActivePage(idx);
      });

    async function cargarNoticias(){
      try{
        var res = await fetch('./data/news.json', { cache: 'no-store' });
        if(!res.ok) throw new Error('news.json HTTP ' + res.status);
        var data = await res.json();
        if(!data || typeof data!=='object' || Array.isArray(data)){

        }
        SECTOR_NOTICIAS.general = Array.isArray(data.general) ? data.general : [];
        SECTOR_NOTICIAS.internacional = Array.isArray(data.internacional) ? data.internacional : [];
        SECTOR_NOTICIAS.salud = Array.isArray(data.salud) ? data.salud : [];

    function safeUrl(url){
      try{
        var u = new URL(url);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? url : null;
      }catch(e){ return null; }

      nots.forEach(function(n){

    function getRangeLabels(range){
      if(range==='12m'){
        var mesesCortos=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        var mLabels=[];
        var baseMes=new Date();
        for(var i=11;i>=0;i--){
          var md=new Date(baseMes);
          md.setDate(1);
          md.setMonth(baseMes.getMonth()-i);
          mLabels.push(mesesCortos[md.getMonth()]);
        }
        return mLabels;
      }
      if(range==='5d'){
        var days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        var labels=[];
        var baseDia=new Date();
        for(var j=4;j>=0;j--){
          var d=new Date(baseDia);
          d.setDate(baseDia.getDate()-j);
          labels.push(days[d.getDay()]);
        }
        return labels;
      }
      var m=[];
      var baseMesDia=new Date();
      for(var k=5;k>=0;k--){
        var dm=new Date(baseMesDia);
        dm.setDate(baseMesDia.getDate()-(k*6));
        m.push(dm.getDate()+'/'+(dm.getMonth()+1));
      }
      return m;
    }

    function buildSeries(base,drift,amp,points){
      var out=[];
      for(var i=0;i<points;i++){
        var val=base + (drift*i) + (Math.sin(i*1.4)*amp);
        var digits=base>=100 ? 1 : base>=10 ? 2 : 3;
        out.push(Number(val.toFixed(digits)));
      }
      return out;
    }

    function destroyCharts(){
      CHART_INSTANCES.forEach(function(c){ if(c&&c.destroy) c.destroy(); });
      CHART_INSTANCES=[];
    }

    function setChartRange(range){
      CHART_RANGE=range;

    function setActiveChart(index){

    function prevChart(){
      var defs = SECTOR_CHARTS[SECTOR_ACTUAL] || SECTOR_CHARTS.general;
      CHART_ACTIVE_INDEX = (CHART_ACTIVE_INDEX - 1 + defs.length) % defs.length;
      syncActiveKPIState();
      renderCharts(SECTOR_ACTUAL,true);

    function nextChart(){
      var defs = SECTOR_CHARTS[SECTOR_ACTUAL] || SECTOR_CHARTS.general;
      CHART_ACTIVE_INDEX = (CHART_ACTIVE_INDEX + 1) % defs.length;
      syncActiveKPIState();
      renderCharts(SECTOR_ACTUAL,true);

    function escapeHtml(text){
      return String(text)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function getSafeColor(color){
      return /^#(?:[0-9a-fA-F]{3}){1,2}$/.test(color||'') ? color : DEFAULT_CHART_COLOR;
    }

    function attachChartSwipe(el){
      if(!el) return;
      var startX = 0, startY = 0, touching = false;
      el.addEventListener('touchstart', function(e){
        if(!e.touches || !e.touches.length) return;
        touching = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, {passive:true});
      el.addEventListener('touchend', function(e){
        if(!touching || !e.changedTouches || !e.changedTouches.length) return;
        touching = false;
        var dx = e.changedTouches[0].clientX - startX;
        var dy = e.changedTouches[0].clientY - startY;
        if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
          if(dx < 0) nextChart();
          else prevChart();
        }
      }, {passive:true});
    }

    function renderCharts(sector,preserveIndex){
      var defs=SECTOR_CHARTS[sector] || SECTOR_CHARTS.general;
      if(!defs.length) defs=SECTOR_CHARTS.general;

      var track=document.getElementById('chartsTrack');
      destroyCharts();

      if(!preserveIndex || CHART_ACTIVE_INDEX>defs.length-1) CHART_ACTIVE_INDEX=0;

      var def=defs[CHART_ACTIVE_INDEX] || defs[0];
      var safeColor=getSafeColor(def.color);

      var rangeBtns=['5d','1m','12m'].map(function(r){
        var cls=r===CHART_RANGE ? 'range-btn active' : 'range-btn';
        return '<button class="'+cls+'" onclick="setChartRange(\''+r+'\')">'+RANGE_LABELS[r]+'</button>';
      }).join('');

      track.innerHTML =
        '<div class="chart-head">' +
          '<div class="chart-title">' +
            '<div class="chart-accent" style="background:'+safeColor+'"></div>' +
            escapeHtml(def.title) +
            '<span class="chart-sub">'+escapeHtml(def.sub)+'</span>' +
          '</div>' +
        '</div>' +
        '<div class="chart-wrap" id="chartSwipeArea"><canvas id="chart-'+sector+'-'+CHART_ACTIVE_INDEX+'"></canvas></div>' +
        '<div class="chart-nav-bottom">' +
          '<div class="chart-range-bottom">'+rangeBtns+'</div>' +
          '<div class="chart-nav-right">' +
            '<button class="chart-nav-btn" onclick="prevChart()" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>' +
            '<button class="chart-nav-btn" onclick="nextChart()" aria-label="Siguiente"><i class="fas fa-chevron-right"></i></button>' +
          '</div>' +
        '</div>';

      var labels=getRangeLabels(CHART_RANGE);
      var data=buildSeries(def.base,def.drift,def.amp,labels.length);
      var canvas=document.getElementById('chart-'+sector+'-'+CHART_ACTIVE_INDEX);

      CHART_INSTANCES.push(new Chart(canvas,{
        type:'line',
        data:{labels:labels,datasets:[{data:data,borderColor:safeColor,backgroundColor:safeColor+'33',tension:.35,fill:true,borderWidth:2,pointRadius:2}]},
        options:baseOpts
      }));

      attachChartSwipe(document.getElementById('chartSwipeArea'));
    }

      {symbol:'JPM', name:'JPMorgan Chase & Co.', price:157.07, chg:-2.79, pct:-1.75},
      {symbol:'JNJ', name:'Johnson & Johnson', price:164.80, chg:-1.00, pct:-0.60}
    ];

    function formatPrice(v){
      return Number(v).toLocaleString('en-US', {maximumFractionDigits:2, minimumFractionDigits:(Number(v)%1===0?0:2)});
    }
    function formatSigned(v){
      var n = Number(v);
      var sign = n > 0 ? '+' : '';
      return sign + n.toFixed(2);
    }
    function formatPct(v){
      var n = Number(v);
      var sign = n > 0 ? '+' : '';
      return '(' + sign + n.toFixed(2) + '%)';
    }

    function renderStocks(){
      var list = document.getElementById('stockList');
      if(!list) return;

      var html = '';
      STOCKS.forEach(function(s){
        var down = s.chg < 0;
        var cls = down ? 'down' : 'up';
        var ico = down ? 'fa-arrow-down' : 'fa-arrow-up';

        html +=
          '<div class="stock-item">' +
            '<div class="stock-left">' +
              '<div class="stock-symbol">'+escapeHtml(s.symbol)+'</div>' +
              '<div class="stock-name">'+escapeHtml(s.name)+'</div>' +
            '</div>' +
            '<div class="stock-right">' +
              '<div class="stock-price">'+escapeHtml(formatPrice(s.price))+'</div>' +
              '<div class="stock-change '+cls+'">' +
                '<i class="fas '+ico+'"></i> '+escapeHtml(formatSigned(s.chg))+' '+escapeHtml(formatPct(s.pct)) +
              '</div>' +
            '</div>' +
          '</div>';
      });

      list.innerHTML = html;
    }

    /* =========================
       SIWA
       ========================= */
    var siwaOpen=false, siwaChatMode=false;
    var SIWA_AGENT_ENDPOINT='/api/siwa-ask';
    var SIWA_USE_AGENT_FOR_OPEN=true;

    function detectarIntencion(t){
      t=t.toLowerCase();
      if(t.match(/d[oó]lar|usd|clp/)) return 'dolar';
      if(t.match(/cobre|lme/)) return 'cobre';
      if(t.match(/embi|riesgo pa[ií]s/)) return 'embi';
      if(t.match(/impacto|afecta|sector/)) return 'sector_impacto';
      if(t.match(/perspectiva|proyecci[oó]n|futuro/)) return 'sector_perspectiva';
      if(t.match(/riesgo|amenaza/)) return 'sector_riesgo';
      return 'general';
    }

    function generarRespuesta(intencion,texto){
      return 'Panorama general: inflación moderada, riesgo país bajo y sector externo estable.';
    }

    function isOpenQuestion(text){
      var t=(text||'').toLowerCase().trim();
      if(!t) return false;
      if(t.length>70) return true;
      if(t.match(/por qu[eé]|porque|explica|analiza|impacto|escenario|riesgo|proyecci[oó]n|expectativa|recomienda|estrategia|opini[oó]n|conviene/)) return true;
      if(t.includes('?')) return true;
      return false;
    }

    function getSectorContextPayload(){
      var sec=SECTOR_ACTUAL||'general';
      var secObj=SECTORES[sec]||SECTORES.general;
      var kpis=(SECTOR_KPIS[sec]||SECTOR_KPIS.general).slice(0,8);
      return {sector:sec,sector_label:secObj.label||'General',sector_desc:secObj.desc||'',kpis:kpis};
    }

    async function preguntarAgenteCopilot(userText){
      var ctx=getSectorContextPayload();
      var payload={question:userText,sector:ctx.sector,sector_label:ctx.sector_label,sector_desc:ctx.sector_desc,kpis:ctx.kpis,ui_date:new Date().toLocaleDateString('es-CL')};
      var res=await fetch(SIWA_AGENT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok){ var e=await res.text().catch(function(){return 'agent_error';}); throw new Error(e); }
      var data=await res.json();
      if(!data||!data.answer) throw new Error('invalid agent response');
      return data.answer;
    }

    function hora(){ return new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); }

    function siwaAddBot(html){
      var msgs=document.getElementById('siwa-msgs');
      var d=document.createElement('div');
      d.className='sw-msg bot';
      d.innerHTML='<div><div class="sw-bubble">'+html+'</div><div class="sw-time">'+hora()+'</div></div>';
      msgs.appendChild(d);
      msgs.scrollTop=msgs.scrollHeight;
    }

    function siwaAddUser(text){
      var msgs=document.getElementById('siwa-msgs');
      var d=document.createElement('div');
      d.className='sw-msg user';
      d.innerHTML='<div><div class="sw-bubble">'+text+'</div><div class="sw-time">'+hora()+'</div></div>';
      msgs.appendChild(d);
      msgs.scrollTop=msgs.scrollHeight;
    }

    function siwaAddSugs(sugs){
      var msgs=document.getElementById('siwa-msgs');
      var d=document.createElement('div');
      d.className='sw-msg bot';
      d.innerHTML='<div class="sw-sugs">'+sugs.map(function(s){return '<button class="sw-sug" onclick="siwaEnviarTexto(\''+s.replace(/'/g,"\\'")+'\')">'+s+'</button>';}).join('')+'</div>';
      msgs.appendChild(d);
      msgs.scrollTop=msgs.scrollHeight;
    }

    function siwaShowTyping(){
      var msgs=document.getElementById('siwa-msgs');
      var d=document.createElement('div');
      d.className='sw-msg bot';
      d.id='sw-typing';
      d.innerHTML='<div class="sw-bubble">Escribiendo...</div>';
      msgs.appendChild(d);
      msgs.scrollTop=msgs.scrollHeight;
    }

    function siwaHideTyping(){
      var t=document.getElementById('sw-typing');
      if(t) t.remove();
    }

    function siwaShowMenu(){
      siwaChatMode=false;
      var panel=document.getElementById('siwa-panel');
      panel.classList.remove('chat-mode');
      panel.classList.add('menu-visible');
      document.getElementById('siwa-msgs').innerHTML='';
    }

    function siwaToggle(){
      siwaOpen=!siwaOpen;
      var p=document.getElementById('siwa-panel');
      var fab=document.getElementById('siwa-fab');
      if(siwaOpen){
        p.classList.add('open');
        fab.classList.add('expanded');
        siwaShowMenu();
        document.getElementById('siwa-notif').style.display='none';
      } else {
        p.classList.remove('open');
        fab.classList.remove('expanded');
      }
    }

    function siwaClose(){
      siwaOpen=false;
      var p=document.getElementById('siwa-panel');
      var fab=document.getElementById('siwa-fab');
      p.classList.remove('open');
      p.classList.remove('menu-visible');
      fab.classList.remove('expanded');
    }

    function siwaVolverMenu(){
      siwaShowMenu();
    }

    function siwaModoPregunta(){
      siwaChatMode=true;
      var panel=document.getElementById('siwa-panel');
      panel.classList.add('chat-mode');
      panel.classList.remove('menu-visible');
      document.getElementById('siwa-sector-name').textContent=SECTORES[SECTOR_ACTUAL].label;
      document.getElementById('siwa-msgs').innerHTML='';
      siwaAddBot('¡Hola! Soy <strong>Siwa</strong>. Mantengo el contexto del sector seleccionado y puedo consultar el agente Copilot para preguntas abiertas.');
      setTimeout(function(){
        siwaAddSugs(['¿Cómo está el dólar?','¿Qué es el EMBI?','Analiza riesgos del sector actual','Perspectiva 6 meses']);
      },300);
    }

    function siwaSelSector(sector){
      SECTOR_ACTUAL=sector;
      setSector(sector);

      siwaChatMode=true;
      var panel=document.getElementById('siwa-panel');
      panel.classList.add('chat-mode');
      panel.classList.remove('menu-visible');
      document.getElementById('siwa-sector-name').textContent=SECTORES[sector].label;
      document.getElementById('siwa-msgs').innerHTML='';

      var s=SECTORES[sector];
      siwaAddBot('Sector <strong>'+s.icon+' '+s.label+'</strong> seleccionado.<br><br>'+s.desc+'<br><br><small style="color:#94a3b8">Las preguntas abiertas se responderán con análisis del agente Copilot.</small>');
      setTimeout(function(){
        siwaAddSugs(['¿Cómo afecta al sector?','¿Cuáles son los riesgos?','Perspectivas futuras','¿Qué estrategia recomiendas?']);
      },350);
    }

    function siwaEnviarTexto(texto){
      var input=document.getElementById('siwa-input');
      if(input) input.value=texto;
      siwaEnviar();
    }

    async function siwaEnviar(){
      var input=document.getElementById('siwa-input');
      if(!input) return;
      var text=(input.value||'').trim();
      if(!text) return;
      input.value='';
      siwaAddUser(escapeHtml(text));

      var openQ = isOpenQuestion(text);
      if(!openQ || !SIWA_USE_AGENT_FOR_OPEN){
        var intent = detectarIntencion(text);
        var resp = generarRespuesta(intent,text);
        siwaAddBot(escapeHtml(resp));
        return;
      }

      siwaShowTyping();
      try{
        var answer = await preguntarAgenteCopilot(text);
        siwaHideTyping();
        siwaAddBot(answer);
      }catch(e){
        siwaHideTyping();
        console.warn('Error consultando agente:', e);
        siwaAddBot('No pude consultar al agente en este momento. Te dejo una lectura rápida: <strong>riesgo país contenido, inflación moderándose y actividad mixta.</strong>');
      }
    }

    // Init
    setSector('general');
    cargarNoticias();
    renderStocks();
    setActivePage(0);
  </script>
</body>
</html>
