    var SECTOR_NOTICIAS = {

    var NEWS_LOAD_FAILED = false;

    function noticiaFallback(mensaje, titulo){
      return [{
        cls:'o',
        ico:'circle-info',
        tit: titulo || 'Sin novedades sectoriales',
        desc: mensaje || 'No hay noticias disponibles para este sector por ahora.',
        fte:'Sistema'
      }];
    }

    async function cargarNoticias(){
      try{
        var res = await fetch('./data/news.json', { cache: 'no-store' });
        if(!res.ok) throw new Error('news.json HTTP ' + res.status);
        var data = await res.json();
        if(!data || typeof data!=='object' || Array.isArray(data)){
          throw new Error('Formato inválido de news.json');
        }
        SECTOR_NOTICIAS.general = Array.isArray(data.general) ? data.general : [];
        SECTOR_NOTICIAS.internacional = Array.isArray(data.internacional) ? data.internacional : [];
        SECTOR_NOTICIAS.salud = Array.isArray(data.salud) ? data.salud : [];
        NEWS_LOAD_FAILED = false;
        renderNoticias(SECTOR_ACTUAL);
      }catch(e){
        console.warn('No se pudieron cargar noticias dinámicas:', e);
        NEWS_LOAD_FAILED = true;
        SECTOR_NOTICIAS.general = [];
        SECTOR_NOTICIAS.internacional = [];
        SECTOR_NOTICIAS.salud = [];
        renderNoticias(SECTOR_ACTUAL);
      }
    }

    var DEFAULT_CHART_COLOR = '#3b82f6';
    var CHART_RANGE = '1m';
    var CHART_ACTIVE_INDEX = 0;
    var CHART_INSTANCES = [];
    var RANGE_LABELS = {'5d':'5 días','1m':'1 mes','12m':'12 meses'};

function renderKPIs(sector){

  var kpis =
    SECTOR_KPIS[sector] ||
    SECTOR_KPIS.general;

  var grid =
    document.querySelector('.kpi-grid');

  grid.innerHTML = '';

  kpis.forEach(function(k,idx){

    var arrow =
      k.dv === 'up'
        ? '↑'
        : k.dv === 'dn'
          ? '↓'
          : '•';

    var activeCls =
      idx === CHART_ACTIVE_INDEX
        ? ' active'
        : '';

    grid.innerHTML +=

      '<div class="market-row'+activeCls+'" '+
      'onclick="setActiveChart('+idx+')">'+

        '<div class="market-left">'+

          '<div class="market-name">'+
            escapeHtml(k.label || '')+
          '</div>'+

          '<div class="market-sub">'+
            escapeHtml(k.sub || '')+
          '</div>'+

        '</div>'+

        '<div class="market-right">'+

          '<div class="market-value">'+
            escapeHtml(k.val || '—')+
          '</div>'+

          '<div class="market-change '+
            (k.dv || 'fl')+
          '">'+

            arrow+' '+
            escapeHtml(k.dvt || '')+

            (k.dpt
            ? ' ('+escapeHtml(k.dpt)+')'
            : '')+

          '</div>'+

        '</div>'+

      '</div>';

  });

  syncActiveKPIState();
}

   function syncActiveKPIState(){

  document
    .querySelectorAll('.market-row')
    .forEach(function(row,idx){

      row.classList.toggle(
        'active',
        idx === CHART_ACTIVE_INDEX
      );

    });

}

    function safeUrl(url){
      try{
        var u = new URL(url);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? url : null;
      }catch(e){ return null; }
    }

    function renderNoticias(sector){
      var list = document.querySelector('.news-list');
      if(!list) return;

      var nots = SECTOR_NOTICIAS[sector];
      if(!Array.isArray(nots) || !nots.length){
        nots = NEWS_LOAD_FAILED
          ? noticiaFallback('No fue posible cargar las noticias en este momento.', 'Noticias no disponibles')
          : noticiaFallback();
      }

      var html = '';

function getRangeStats(stock){

  var data =
    STOCK_HISTORY[
      stock.ticker
    ]?.[STOCK_RANGE];

  if(!data || data.length < 2){

    return {
      pct:0,
      clp:0
    };

  }

  var first = data[0];
  var last  = data[data.length-1];

  return {

    pct:
      ((last-first)/first)*100,

    clp:
      last-first

  };
}

    function getRangeLabels(range){
      if(range==='12m'){
        var mesesCortos=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        var mLabels=[];
        var baseMes=new Date();
        for(var i=11;i>=0;i--){
          var md=new Date(baseMes);
          md.setDate(1);
          md.setMonth(baseMes.getMonth()-i);
          mLabels.push(mesesCortos[md.getMonth()]);
        }
        return mLabels;
      }
      if(range==='5d'){
        var days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        var labels=[];
        var baseDia=new Date();
        for(var j=4;j>=0;j--){
          var d=new Date(baseDia);
          d.setDate(baseDia.getDate()-j);
          labels.push(days[d.getDay()]);
        }
        return labels;
      }
      var m=[];
      var baseMesDia=new Date();
      for(var k=5;k>=0;k--){
        var dm=new Date(baseMesDia);
        dm.setDate(baseMesDia.getDate()-(k*6));
        m.push(dm.getDate()+'/'+(dm.getMonth()+1));
      }
      return m;
    }

    function buildSeries(base,drift,amp,points){
      var out=[];
      for(var i=0;i<points;i++){
        var val=base + (drift*i) + (Math.sin(i*1.4)*amp);
        var digits=base>=100 ? 1 : base>=10 ? 2 : 3;
        out.push(Number(val.toFixed(digits)));
      }
      return out;
    }

function fmtPct(n){

  return (

}

function fmtClp(n){

  return (
    n > 0 ? '+' : ''

  '$' +
  Math.abs(n)
    .toLocaleString(
      'es-CL',
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}

      return /^#(?:[0-9a-fA-F]{3}){1,2}$/.test(color||'') ? color : DEFAULT_CHART_COLOR;
    }

    function attachChartSwipe(el){
      if(!el) return;
      var startX = 0, startY = 0, touching = false;
      el.addEventListener('touchstart', function(e){
        if(!e.touches || !e.touches.length) return;
        touching = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, {passive:true});
      el.addEventListener('touchend', function(e){
        if(!touching || !e.changedTouches || !e.changedTouches.length) return;
        touching = false;
        var dx = e.changedTouches[0].clientX - startX;
        var dy = e.changedTouches[0].clientY - startY;
        if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
          if(dx < 0) nextChart();
          else prevChart();
        }
      }, {passive:true});
    }

    function renderCharts(sector,preserveIndex){
      var defs=SECTOR_CHARTS[sector] || SECTOR_CHARTS.general;
      if(!defs.length) defs=SECTOR_CHARTS.general;

      var track=document.getElementById('chartsTrack');
      destroyCharts();

      if(!preserveIndex || CHART_ACTIVE_INDEX>defs.length-1) CHART_ACTIVE_INDEX=0;

      var def=defs[CHART_ACTIVE_INDEX] || defs[0];
      var safeColor=getSafeColor(def.color);

      var rangeBtns=['5d','1m','12m'].map(function(r){
        var cls=r===CHART_RANGE ? 'range-btn active' : 'range-btn';
        return '<button class="'+cls+'" onclick="setChartRange(\''+r+'\')">'+RANGE_LABELS[r]+'</button>';
      }).join('');

      track.innerHTML =
        '<div class="chart-head">' +
          '<div class="chart-title">' +
            '<div class="chart-accent" style="background:'+safeColor+'"></div>' +
            escapeHtml(def.title) +
            '<span class="chart-sub">'+escapeHtml(def.sub)+'</span>' +
          '</div>' +
        '</div>' +
        '<div class="chart-wrap" id="chartSwipeArea"><canvas id="chart-'+sector+'-'+CHART_ACTIVE_INDEX+'"></canvas></div>' +
        '<div class="chart-nav-bottom">' +
          '<div class="chart-range-bottom">'+rangeBtns+'</div>' +
          '<div class="chart-nav-right">' +
            '<button class="chart-nav-btn" onclick="prevChart()" aria-label="Anterior"><i class="fas fa-chevron-left"></i></button>' +
            '<button class="chart-nav-btn" onclick="nextChart()" aria-label="Siguiente"><i class="fas fa-chevron-right"></i></button>' +
          '</div>' +
        '</div>';

      var labels=getRangeLabels(CHART_RANGE);
      var data=buildSeries(def.base,def.drift,def.amp,labels.length);
      var canvas=document.getElementById('chart-'+sector+'-'+CHART_ACTIVE_INDEX);

      CHART_INSTANCES.push(new Chart(canvas,{
        type:'line',
        data:{labels:labels,datasets:[{data:data,borderColor:safeColor,backgroundColor:safeColor+'33',tension:.35,fill:true,borderWidth:2,pointRadius:2}]},
        options:baseOpts
      }));

      attachChartSwipe(document.getElementById('chartSwipeArea'));
    }

var CURRENT_PAGE = 'economia';

    var siwaOpen=false, siwaChatMode=false;
    var SIWA_AGENT_ENDPOINT='/api/siwa-ask';
    var SIWA_USE_AGENT_FOR_OPEN=true;

    function detectarIntencion(t){
      t=t.toLowerCase();
      if(t.match(/d[oó]lar|usd|clp/)) return 'dolar';
      if(t.match(/cobre|lme/)) return 'cobre';
      if(t.match(/embi|riesgo pa[ií]s/)) return 'embi';
      if(t.match(/impacto|afecta|sector/)) return 'sector_impacto';
      if(t.match(/perspectiva|proyecci[oó]n|futuro/)) return 'sector_perspectiva';
      if(t.match(/riesgo|amenaza/)) return 'sector_riesgo';
      return 'general';
    }

    function generarRespuesta(intencion,texto){
      return 'Panorama general: inflación moderada, riesgo país bajo y sector externo estable.';
    }

    function isOpenQuestion(text){
      var t=(text||'').toLowerCase().trim();
      if(!t) return false;
      if(t.length>70) return true;
      if(t.match(/por qu[eé]|porque|explica|analiza|impacto|escenario|riesgo|proyecci[oó]n|expectativa|recomienda|estrategia|opini[oó]n|conviene/)) return true;
      if(t.includes('?')) return true;
      return false;
    }

    function getSectorContextPayload(){
      var sec=SECTOR_ACTUAL||'general';
      var secObj=SECTORES[sec]||SECTORES.general;
      var kpis=(SECTOR_KPIS[sec]||SECTOR_KPIS.general).slice(0,8);
      return {sector:sec,sector_label:secObj.label||'General',sector_desc:secObj.desc||'',kpis:kpis};
    }

    async function preguntarAgenteCopilot(userText){
      var ctx=getSectorContextPayload();
      var payload={question:userText,sector:ctx.sector,sector_label:ctx.sector_label,sector_desc:ctx.sector_desc,kpis:ctx.kpis,ui_date:new Date().toLocaleDateString('es-CL')};
      var res=await fetch(SIWA_AGENT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok){ var e=await res.text().catch(function(){return 'agent_error';}); throw new Error(e); }
      var data=await res.json();
      if(!data||!data.answer) throw new Error('invalid agent response');
      return data.answer;
    }

function getPrice(stock){

  if(typeof stock.precio === 'number'){
    return stock.precio;
  }

  return Number(
    String(stock.precio)
      .replace(/\./g,'')
      .replace(',','.')
  );

}

function getPct(stock){

  return stock.cambioPct ??
         parseFloat(
           stock.cambio
             .replace('%','')
             .replace(',','.')
         );

}

function getClp(stock){

  if(typeof stock.cambioClp === 'number'){
    return stock.cambioClp;
  }

  return parseFloat(
    String(stock.variacionPrecio)
      .replace('$','')
      .replace(/\./g,'')
      .replace(',','.')
  );

}

    async function siwaEnviar(){
      var input=document.getElementById('siwa-input');
      if(!input) return;
      var text=(input.value||'').trim();
      if(!text) return;
      siwaAddUser(escapeHtml(text));
      input.value='';
      siwaShowTyping();
      try{
        var resp;
        if(SIWA_USE_AGENT_FOR_OPEN && isOpenQuestion(text)){
          resp=await preguntarAgenteCopilot(text);
        } else {
          resp=generarRespuesta(detectarIntencion(text),text);
        }
        siwaHideTyping();
        siwaAddBot(resp);
      } catch(e){
        siwaHideTyping();
        siwaAddBot('Lo siento, hubo un error al procesar tu consulta. Intenta nuevamente.');
      }
    }

    function siwaEnviarTexto(texto){
      var input=document.getElementById('siwa-input');
      if(input){
        input.value=texto;
        siwaEnviar();
      }
    }
