<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Dashboard Económico Chile</title>
  <meta name="description" content="Dashboard ejecutivo con indicadores económicos de Chile en tiempo real: Dólar, Cobre, UF, EMBI, IPC, TPM y más. Con asistente virtual Siwa.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0f172a; --bg2:#1e293b; --bg3:#16213e;
      --blue:#3b82f6; --green:#22c55e; --orange:#f97316;
      --red:#ef4444; --purple:#a78bfa; --white:#fff; --muted:#94a3b8;
    }
    body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--white); min-height:100vh; }

    .top-bar { background:rgba(15,23,42,.96); border-bottom:1px solid rgba(59,130,246,.25); padding:0 20px; min-height:44px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(10px); }
    .top-bar-left { display:flex; align-items:center; gap:8px; }
    .top-bar-bar { width:3px; height:18px; background:var(--blue); border-radius:999px; }
    .top-bar-title { font-size:1rem; font-weight:700; color:var(--white); }
    .top-bar-title span { color:var(--blue); }
    .top-bar-date { font-size:.72rem; color:var(--muted); white-space:nowrap; }

    .main { padding:16px 24px 100px; }
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-bottom:14px; }
    .kpi-card { background:var(--bg2); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:12px 14px; border-left:3px solid var(--blue); transition:transform .2s,border-color .2s,box-shadow .2s,background .2s; width:100%; text-align:left; color:var(--white); }
    .kpi-card:hover { transform:translateY(-2px); }
    .kpi-card-btn { cursor:pointer; font:inherit; }
    .kpi-card.active { background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.45); box-shadow:0 0 0 1px rgba(59,130,246,.18); }
    .kpi-card.green { border-left-color:var(--green); }
    .kpi-card.orange { border-left-color:var(--orange); }
    .kpi-card.purple { border-left-color:var(--purple); }
    .kpi-label { font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:4px; }
    .kpi-value { font-size:1.22rem; font-weight:700; color:var(--white); margin-bottom:4px; }
    .kpi-value.green { color:var(--green); }
    .kpi-diff { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .dv { font-size:.65rem; font-weight:600; }
    .dv.up { color:var(--green); } .dv.dn { color:var(--red); } .dv.fl { color:var(--muted); }
    .dp { font-size:.6rem; font-weight:600; padding:1px 5px; border-radius:8px; }
    .dp.up { background:rgba(34,197,94,.15); color:var(--green); }
    .dp.dn { background:rgba(239,68,68,.15); color:var(--red); }
    .dp.fl { background:rgba(176,184,200,.12); color:var(--muted); }
    .kpi-sub { font-size:.57rem; color:var(--muted); margin-left:auto; }

    .charts-panel-wrap { margin-bottom:14px; }
    .chart-panel { background:var(--bg2); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:12px 14px; }
    .chart-overline { font-size:.63rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:8px; }
    .chart-title { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .chart-accent { width:10px; height:3px; border-radius:2px; background:var(--blue); }
    .chart-sub { font-size:.53rem; color:var(--muted); margin-left:auto; text-transform:none; }
    .chart-wrap { height:170px; position:relative; }
    .chart-ranges { display:flex; gap:5px; margin-bottom:8px; }
    .range-btn { font-size:.6rem; font-weight:700; padding:4px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05); color:var(--muted); cursor:pointer; text-transform:uppercase; }
    .range-btn.active { background:rgba(59,130,246,.2); border-color:var(--blue); color:var(--white); }

    .news-panel { background:rgba(59,130,246,.07); border:1px solid rgba(59,130,246,.2); border-radius:10px; padding:12px 16px; }
    .news-title { font-size:.65rem; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.07em; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .news-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ni { display:flex; align-items:flex-start; gap:7px; padding:7px 9px; border-radius:7px; background:rgba(255,255,255,.04); border-left:2px solid var(--blue); }
    .ni.o { border-left-color:var(--orange); } .ni.g { border-left-color:var(--green); } .ni.p { border-left-color:var(--purple); }
    .ni-ico { font-size:.68rem; margin-top:2px; }
    .ni-txt { font-size:.7rem; line-height:1.4; }
    .ni-src { color:var(--muted); font-size:.6rem; margin-top:2px; }

    .dash-footer { background:rgba(255,255,255,.02); border-top:1px solid rgba(255,255,255,.05); padding:7px 24px; font-size:.57rem; color:var(--muted); }

    #siwa-fab {
      position:fixed; bottom:24px; right:24px; z-index:9999;
      width:66px; height:66px; border-radius:50%; cursor:pointer;
      border:3px solid rgba(59,130,246,.6); box-shadow:0 4px 20px rgba(59,130,246,.4);
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#1d4ed8,#3b82f6); font-size:2rem;
      overflow:hidden;
    }
    #siwa-avatar-fab{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
    }
    #siwa-notif {
      position:absolute; top:-3px; right:-3px; width:18px; height:18px; border-radius:50%;
      background:#ef4444; border:2px solid var(--bg); display:none; align-items:center; justify-content:center;
      font-size:.58rem; font-weight:700; color:#fff;
    }

    #siwa-panel {
      position:fixed; bottom:100px; right:24px; z-index:9998;
      width:340px; background:var(--bg2); border:1px solid rgba(59,130,246,.25);
      border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.6);
      display:none; flex-direction:column; overflow:hidden;
    }
    #siwa-panel.open { display:flex; }

    #siwa-header {
      background:linear-gradient(135deg,#1a1a2e,#16213e);
      border-bottom:2px solid var(--blue);
      padding:12px 16px; display:flex; align-items:center; gap:10px;
    }
    #siwa-header-avatar{
      width:38px;
      height:38px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid rgba(59,130,246,.6);
      flex-shrink:0;
    }
    #siwa-header-info h4 { font-size:.88rem; font-weight:700; margin:0; }
    #siwa-header-info p { font-size:.65rem; color:var(--green); margin:0; }
    #siwa-close,#siwa-back { background:none; border:none; color:var(--muted); cursor:pointer; }

    #siwa-menu { padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.06); }
    #siwa-menu-title { font-size:.65rem; color:var(--muted); font-weight:600; text-transform:uppercase; margin-bottom:10px; }
    .siwa-menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .siwa-menu-btn { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:var(--white); padding:9px 12px; border-radius:10px; font-size:.75rem; font-weight:600; cursor:pointer; transition:all .2s; }
    .siwa-menu-btn:hover { background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.35); }
    .siwa-menu-btn.active { background:rgba(59,130,246,.2); border-color:rgba(59,130,246,.45); box-shadow:0 0 0 1px rgba(59,130,246,.16); }
    .siwa-menu-btn.pregunta { grid-column:1/-1; background:rgba(167,139,250,.1); border-color:rgba(167,139,250,.3); color:var(--purple); }

    #siwa-sector-label { padding:6px 16px; background:rgba(59,130,246,.08); border-bottom:1px solid rgba(255,255,255,.05); font-size:.63rem; display:none; }
    #siwa-sector-label span { color:var(--blue); font-weight:700; }

    #siwa-msgs { flex:1; padding:12px 14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px; max-height:260px; }
    .sw-msg { display:flex; gap:8px; }
    .sw-msg.user { flex-direction:row-reverse; }
    .sw-bubble { max-width:84%; padding:8px 12px; border-radius:14px; font-size:.78rem; line-height:1.5; }
    .sw-msg.bot .sw-bubble { background:var(--bg3); border:1px solid rgba(255,255,255,.07); }
    .sw-msg.user .sw-bubble { background:linear-gradient(135deg,#1d4ed8,var(--blue)); }
    .sw-time { font-size:.57rem; color:#475569; margin-top:2px; }
    .sw-sugs { display:flex; flex-wrap:wrap; gap:5px; }
    .sw-sug { background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.25); color:var(--blue); padding:4px 9px; border-radius:14px; font-size:.68rem; cursor:pointer; }

    #siwa-input-area { padding:10px 14px; border-top:1px solid rgba(255,255,255,.06); display:flex; gap:8px; }
    #siwa-input { flex:1; background:var(--bg3); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:8px 12px; color:var(--white); }
    #siwa-send { width:34px; height:34px; border-radius:10px; background:var(--blue); border:none; color:var(--white); cursor:pointer; }

    #siwa-panel.chat-mode #siwa-menu { display:none; }
    #siwa-panel.chat-mode #siwa-sector-label { display:flex; }
    #siwa-panel:not(.chat-mode) #siwa-sector-label,
    #siwa-panel:not(.chat-mode) #siwa-msgs,
    #siwa-panel:not(.chat-mode) #siwa-input-area { display:none; }

    @media(max-width:900px) {
      .news-list { grid-template-columns:1fr; }
      .main { padding:12px 14px 100px; }
    }
    @media(max-width:640px) {
      .top-bar { padding:10px 14px; min-height:auto; align-items:flex-start; gap:8px; flex-direction:column; }
      .top-bar-date { font-size:.68rem; }
      .kpi-grid { grid-template-columns:1fr; }
    }
    @media(max-width:480px) {
      #siwa-panel { width:calc(100vw - 32px); right:16px; bottom:90px; }
      #siwa-fab { bottom:16px; right:16px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="top-bar-bar"></div>
      <div class="top-bar-title" id="dashTitle">Dashboard Económico — <span>Chile</span></div>
    </div>
    <div class="top-bar-date" id="fechaHoy"></div>
  </div>

  <div class="main">
    <div class="kpi-grid"></div>

    <div class="charts-panel-wrap">
      <div class="chart-panel">
        <div class="chart-overline">Indicador seleccionado</div>
        <div id="chartsTrack"></div>
      </div>
    </div>

    <div class="news-panel">
      <div class="news-title"><i class="fas fa-newspaper"></i>Noticias Económicas del Día</div>
      <div class="news-list"></div>
    </div>
  </div>

  <div class="dash-footer">
    <i class="fas fa-database"></i> Fuentes: Banco Central de Chile · mindicador.cl · prensa económica
  </div>

  <div id="siwa-fab" onclick="siwaToggle()" title="Hablar con Siwa">
    <img src="Siwa.png" alt="Siwa" id="siwa-avatar-fab" />
    <div id="siwa-notif">1</div>
  </div>

  <div id="siwa-panel">
    <div id="siwa-header">
      <img src="Siwa.png" alt="Siwa" id="siwa-header-avatar" />
      <div id="siwa-header-info">
        <h4>Siwa — Analista Económica</h4>
        <p>En línea · Chile</p>
      </div>
      <button id="siwa-back" onclick="siwaVolverMenu()"><i class="fas fa-arrow-left"></i> Menú</button>
      <button id="siwa-close" onclick="siwaClose()"><i class="fas fa-times"></i></button>
    </div>

    <div id="siwa-menu">
      <div id="siwa-menu-title">¿Qué necesitas?</div>
      <div class="siwa-menu-grid">
        <button id="btn-mineria" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('mineria')">⛏️ Minería</button>
        <button id="btn-inmobiliario" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('inmobiliario')">🏠 Inmobiliario</button>
        <button id="btn-financiero" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('financiero')">🏦 Financiero</button>
        <button id="btn-retail" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('retail')">🛒 Retail</button>
        <button id="btn-energia" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('energia')">⚡ Energía</button>
        <button id="btn-general" class="siwa-menu-btn siwa-sector-btn" onclick="siwaSelSector('general')">🌐 General</button>
        <button class="siwa-menu-btn pregunta" onclick="siwaModoPregunta()"><i class="fas fa-comment-dots"></i> ¿Quieres hacer una pregunta?</button>
      </div>
    </div>

    <div id="siwa-sector-label">
      <i class="fas fa-chart-bar"></i> Sector activo: <span id="siwa-sector-name">General</span>
    </div>

    <div id="siwa-msgs"></div>

    <div id="siwa-input-area">
      <input id="siwa-input" placeholder="Escribe tu pregunta..." type="text" onkeypress="if(event.key==='Enter') siwaEnviar()"/>
      <button id="siwa-send" onclick="siwaEnviar()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    var hoy = new Date();
    document.getElementById('fechaHoy').textContent = hoy.getDate() + ' de ' + meses[hoy.getMonth()] + ' de ' + hoy.getFullYear();

    var SECTORES = {
      general:{label:'General',icon:'🌐',desc:'Panorama macroeconómico general de Chile.'},
      mineria:{label:'Minería',icon:'⛏️',desc:'Sector minero: foco en cobre, dólar, costos e inversión.'},
      inmobiliario:{label:'Inmobiliario',icon:'🏠',desc:'Sector inmobiliario: UF, TPM, inflación y crédito.'},
      financiero:{label:'Financiero',icon:'🏦',desc:'Sector financiero: TPM, EMBI, tipo de cambio y tasas.'},
      retail:{label:'Retail/Consumo',icon:'🛒',desc:'Retail: IPC, empleo, importaciones y confianza consumidor.'},
      energia:{label:'Energía',icon:'⚡',desc:'Energía: petróleo, dólar, IPC y costos marginales.'}

        {label:'IPC',ico:'percent',val:'-0,2% m/m',dv:'dn',dvt:'-0,2 pp',dp:'up',dpt:'Acum +2,1%',sub:'12m +3,8%',color:'green'},

        {label:'Riesgo país Chile',ico:'shield-alt',val:'89 pb',dv:'fl',dvt:'0 pb',dp:'fl',dpt:'EMBI',sub:'CDS 5Y: 63 pb'},

    function getRangeLabels(range){
      if(range==='12m'){
        var mesesCortos=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        var mLabels=[];
        var baseMes=new Date();
        for(var i=11;i>=0;i--){ var md=new Date(baseMes); md.setDate(1); md.setMonth(baseMes.getMonth()-i); mLabels.push(mesesCortos[md.getMonth()]); }
        return mLabels;
      }
      if(range==='5d'){
        var days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        var labels=[];
        var baseDia=new Date();
        for(var i=4;i>=0;i--){ var d=new Date(baseDia); d.setDate(baseDia.getDate()-i); labels.push(days[d.getDay()]); }
        return labels;
      }
      var m=[];
      var baseMesDia=new Date();
      for(var j=5;j>=0;j--){ var dm=new Date(baseMesDia); dm.setDate(baseMesDia.getDate()-(j*6)); m.push(dm.getDate()+'/'+(dm.getMonth()+1)); }
      return m;
    }

    function buildSeries(base,drift,amp,points){
      var out=[];
      for(var i=0;i<points;i++){
        var val=base + (drift*i) + (Math.sin(i*1.4)*amp);
        var digits=base>=100 ? 1 : base>=10 ? 2 : 3;
        out.push(Number(val.toFixed(digits)));
      }
      return out;
    }

    function escapeHtml(text){
      return String(text)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function renderCharts(sector,preserveIndex){
      var defs=SECTOR_CHARTS[sector] || SECTOR_CHARTS.general;
      if(!defs.length) defs=SECTOR_CHARTS.general;
      var track=document.getElementById('chartsTrack');
      destroyCharts();
      if(!preserveIndex || CHART_ACTIVE_INDEX>defs.length-1) CHART_ACTIVE_INDEX=0;
      var def=defs[CHART_ACTIVE_INDEX] || defs[0];
      var btns=['5d','1m','12m'].map(function(r){
        var cls=r===CHART_RANGE ? 'range-btn active' : 'range-btn';
        return '<button class="'+cls+'" onclick="setChartRange(\''+r+'\')">'+RANGE_LABELS[r]+'</button>';
      }).join('');
      track.innerHTML='<div class="chart-title"><div class="chart-accent" style="background:'+def.color+'"></div>'+escapeHtml(def.title)+'<span class="chart-sub">'+escapeHtml(def.sub)+'</span></div><div class="chart-ranges">'+btns+'</div><div class="chart-wrap"><canvas id="chart-'+sector+'-'+CHART_ACTIVE_INDEX+'"></canvas></div>';

      var labels=getRangeLabels(CHART_RANGE);
      var data=buildSeries(def.base,def.drift,def.amp,labels.length);
      var canvas=document.getElementById('chart-'+sector+'-'+CHART_ACTIVE_INDEX);
      var type='line';
      CHART_INSTANCES.push(new Chart(canvas,{
        type:type,
        data:{labels:labels,datasets:[{data:data,borderColor:def.color,backgroundColor:type==='bar'?def.color+'99':def.color+'33',tension:.35,fill:type!=='bar',borderWidth:2,pointRadius:2}]},
        options:baseOpts
      }));
    }

    function detectarIntencion(t){
      t=t.toLowerCase();
      if(t.match(/d[oó]lar|usd|clp/)) return 'dolar';
      if(t.match(/cobre|lme/)) return 'cobre';
      if(t.match(/embi|riesgo pa[ií]s/)) return 'embi';
      if(t.match(/impacto|afecta|sector/)) return 'sector_impacto';
      if(t.match(/perspectiva|proyecci[oó]n|futuro/)) return 'sector_perspectiva';
      if(t.match(/riesgo|amenaza/)) return 'sector_riesgo';
      return 'general';
    }

    function generarRespuesta(intencion,texto){
      if(intencion==='sector_impacto' && SECTOR_ACTUAL!=='general' && SECTOR_KB[SECTOR_ACTUAL]) return SECTOR_KB[SECTOR_ACTUAL].impacto;
      if(intencion==='sector_perspectiva' && SECTOR_ACTUAL!=='general' && SECTOR_KB[SECTOR_ACTUAL]) return SECTOR_KB[SECTOR_ACTUAL].perspectiva;
      if(intencion==='sector_riesgo' && SECTOR_ACTUAL!=='general' && SECTOR_KB[SECTOR_ACTUAL]) return SECTOR_KB[SECTOR_ACTUAL].riesgo;
      if(KB[intencion]) return KB[intencion][0];
      return KB.general[0];
    }

    function isOpenQuestion(text){
      var t=(text||'').toLowerCase().trim();
      if(!t) return false;
      if(t.match(/d[oó]lar|usd|clp|euro|eur|uf|utm|ipc|inflaci[oó]n|tpm|cobre|lme|embi|riesgo pa[ií]s|ipsa|wti|brent/)){
        if(t.match(/analiza|explica|escenario|proyecci[oó]n|estrategia|recomienda|sensibilidad|trade-off|impacto/)) return true;
        return false;
      }
      if(t.length>70) return true;
      if(t.match(/por qu[eé]|porque|explica|analiza|impacto|escenario|riesgo|proyecci[oó]n|expectativa|recomienda|estrategia|opini[oó]n|conviene/)) return true;
      if(t.includes('?')) return true;
      return false;
    }

    function getSectorContextPayload(){
      var sec=SECTOR_ACTUAL||'general';
      var secObj=SECTORES[sec]||SECTORES.general;
      var kpis=(SECTOR_KPIS[sec]||SECTOR_KPIS.general).slice(0,8);
      return {sector:sec,sector_label:secObj.label||'General',sector_desc:secObj.desc||'',kpis:kpis};
    }

    async function preguntarAgenteCopilot(userText){
      var ctx=getSectorContextPayload();
      var payload={question:userText,sector:ctx.sector,sector_label:ctx.sector_label,sector_desc:ctx.sector_desc,kpis:ctx.kpis,ui_date:new Date().toLocaleDateString('es-CL')};
      var res=await fetch(SIWA_AGENT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!res.ok){ var e=await res.text().catch(function(){return 'agent_error';}); throw new Error(e); }
      var data=await res.json();
      if(!data||!data.answer) throw new Error('invalid agent response');
      return data.answer;
    }

      document.getElementById('siwa-sector-name').textContent=SECTORES[SECTOR_ACTUAL].label;
      document.getElementById('siwa-msgs').innerHTML='';
      siwaAddBot('¡Hola! Soy <strong>Siwa</strong>. Mantengo el contexto del sector seleccionado y puedo consultar el agente Copilot para preguntas abiertas.');
      setTimeout(function(){ siwaAddSugs(['¿Cómo está el dólar?','¿Qué es el EMBI?','Analiza riesgos del sector actual','Perspectiva 6 meses']); },300);
      setTimeout(function(){ document.getElementById('siwa-input').focus(); },150);
    }

    function siwaSelSector(sector){
      SECTOR_ACTUAL=sector; setSector(sector);
      siwaChatMode=true;
      document.getElementById('siwa-panel').classList.add('chat-mode');
      document.getElementById('siwa-sector-name').textContent=SECTORES[sector].label;
      document.getElementById('siwa-msgs').innerHTML='';
      var s=SECTORES[sector];
      siwaAddBot('Sector <strong>'+s.icon+' '+s.label+'</strong> seleccionado.<br><br>'+s.desc+'<br><br><small style="color:#94a3b8">Las preguntas abiertas se responderán con análisis del agente Copilot.</small>');
      setTimeout(function(){ siwaAddSugs(['¿Cómo afecta al sector?','¿Cuáles son los riesgos?','Perspectivas futuras','¿Qué estrategia recomiendas?']); },350);
      setTimeout(function(){ document.getElementById('siwa-input').focus(); },150);
    }

    async function siwaEnviarTexto(texto){
      if(!siwaChatMode){ siwaModoPregunta(); setTimeout(function(){siwaEnviarTexto(texto);},250); return; }
      siwaAddUser(texto);
      siwaShowTyping();
      try{
        var intencion=detectarIntencion(texto);
        var usarAgente=SIWA_USE_AGENT_FOR_OPEN && isOpenQuestion(texto);
        var resp=usarAgente ? await preguntarAgenteCopilot(texto) : generarRespuesta(intencion,texto);
        siwaHideTyping();
        siwaAddBot(resp);
        var sugs=SECTOR_ACTUAL!=='general' ? ['¿Cómo afecta al sector?','¿Cuáles son los riesgos?','Perspectivas futuras'] : ['¿Cómo está el cobre?','¿Qué es el EMBI?','Resumen del día'];
        setTimeout(function(){ siwaAddSugs(sugs); },300);
      }catch(e){
        siwaHideTyping();
        var fallback=generarRespuesta(detectarIntencion(texto),texto);
        siwaAddBot(fallback+'<br><br><small style="color:#94a3b8">*(No pude conectar con el agente Copilot; respuesta en modo local.)*</small>');
      }
    }

    function siwaEnviar(){
      var input=document.getElementById('siwa-input');
      var text=input.value.trim();
      if(!text) return;
      input.value='';
      siwaEnviarTexto(text);
    }

    setSector('general');
    setTimeout(function(){ if(!siwaOpen) document.getElementById('siwa-notif').style.display='flex'; },2000);
  </script>
</body>
</html>
